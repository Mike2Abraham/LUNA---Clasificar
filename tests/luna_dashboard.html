<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUNA · Análisis</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
    .app { max-width: 1200px; margin: 0 auto; }

    /* Header & Inputs */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .brand h1 { font-size: 1.8rem; font-weight: 800; }
    .brand p { color: var(--muted); font-size: 0.9rem; }
    
    .controls { background: var(--surface); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 32px; }
    .input-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .input-row input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: #f1f5f9; color: var(--text); }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { 
      background: var(--surface); border-radius: 16px; border: 1px solid var(--border); 
      padding: 20px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }
    .card-header { display: flex; flex-direction: column; gap: 4px; }
    .card-cat { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
    .card-title { font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
    .card-subtitle { font-size: 0.9rem; color: var(--muted); font-weight: 500; }
    
    .card-body { display: flex; flex-wrap: wrap; gap: 12px; border-top: 1px solid var(--border); padding-top: 16px; }
    .data-item { display: flex; flex-direction: column; gap: 2px; }
    .data-label { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .data-value { font-size: 0.9rem; font-weight: 500; }
    
    .card-footer { font-size: 0.75rem; color: var(--muted); background: #f8fafc; padding: 8px; border-radius: 6px; word-break: break-all; margin-top: auto; }

    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
    .badge.ok { background: #d1fae5; color: #065f46; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .badge.err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <h1>LUNA</h1>
        <p>Clasificador inteligente de archivos</p>
      </div>
      <button class="btn btn-primary" id="runBtn">Ejecutar 20 casos</button>
    </div>

    <div class="controls">
      <div id="customInputs"></div>
      <div style="display:flex; gap:12px; margin-top:12px;">
        <button class="btn btn-secondary" id="addRowBtn">+ Añadir ruta</button>
        <button class="btn btn-primary" id="runCustomBtn">Analizar rutas</button>
      </div>
    </div>

    <div class="grid" id="resultsGrid">
      <div style="grid-column: 1/-1; text-align:center; color:var(--muted);">Esperando análisis...</div>
    </div>
  </div>

  <script>
    const resultsGrid = document.getElementById('resultsGrid');
    const customInputs = document.getElementById('customInputs');

    // --- Renderizado de Tarjeta ---
    function renderCard(item) {
      const badge = item.estado === 'ok' ? 'ok' : item.estado === 'warning' ? 'warn' : 'err';
      const badgeText = item.estado === 'ok' ? 'OK' : item.estado === 'warning' ? 'Aviso' : 'Error';
      
      const etiquetaVariado = item.etiquetaVariado || null;
      const subtituloFinal = item.subtitulo || (item.categoriaHumana === 'Variado' && etiquetaVariado ? etiquetaVariado : '');

      // Construir HTML de detalles (solo si hay datos)
      let detallesHtml = '';
      if (item.detalles && item.detalles.length > 0) {
        detallesHtml = item.detalles.map(d => `
          <div class="data-item">
            <span class="data-label">${d.etiqueta}</span>
            <span class="data-value">${d.valor}</span>
          </div>
        `).join('');
      }

      // Subtítulo opcional
      const subtituloHtml = subtituloFinal ? `<div class="card-subtitle">${subtituloFinal}</div>` : '';
      
      // Título (si es null, usamos el nombre del archivo)
      const titulo = item.titulo || 'Archivo sin nombre claro';

      return `
        <div class="card">
          <div class="card-header">
            <div style="display:flex; justify-content:space-between;">
              <span class="card-cat">${item.categoriaHumana || 'Desconocido'}</span>
              <span class="badge ${badge}">${badgeText}</span>
            </div>
            <div class="card-title">${titulo}</div>
            ${subtituloHtml}
          </div>
          
          ${detallesHtml ? `<div class="card-body">${detallesHtml}</div>` : ''}
          
          <div class="card-footer">${item.ruta}</div>
          ${item.error ? `<div style="color:var(--danger); font-size:0.8rem; margin-top:8px;">${item.error}</div>` : ''}
        </div>
      `;
    }

    // --- Lógica de la UI ---
    async function runSuite() {
      resultsGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center;">Analizando...</div>';
      try {
        const res = await fetch('/api/run');
        const data = await res.json();
        if (!data.resultados) throw new Error('Sin datos');
        resultsGrid.innerHTML = data.resultados.map(renderCard).join('');
      } catch (e) {
        resultsGrid.innerHTML = `<div style="color:var(--danger);">Error: ${e.message}</div>`;
      }
    }

    async function runCustom() {
      const inputs = customInputs.querySelectorAll('input');
      const casos = Array.from(inputs).map(i => ({ ruta: i.value.trim() })).filter(c => c.ruta);
      if (casos.length === 0) return alert('Añade alguna ruta');

      resultsGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center;">Analizando...</div>';
      try {
        const res = await fetch('/api/run-custom', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ casos })
        });
        const data = await res.json();
        if (!data.resultados) throw new Error('Sin datos');
        resultsGrid.innerHTML = data.resultados.map(renderCard).join('');
      } catch (e) {
        resultsGrid.innerHTML = `<div style="color:var(--danger);">Error: ${e.message}</div>`;
      }
    }

    // --- Inputs Dinámicos ---
    function addInput() {
      const div = document.createElement('div');
      div.className = 'input-row';
      div.innerHTML = `<input type="text" placeholder="Ej: D:\\SERIES\\Silo\\Silo - 204.mkv"><button class="btn btn-secondary" onclick="this.parentElement.remove()">×</button>`;
      customInputs.appendChild(div);
    }

    addInput(); addInput(); addInput();
    document.getElementById('addRowBtn').onclick = addInput;
    document.getElementById('runBtn').onclick = runSuite;
    document.getElementById('runCustomBtn').onclick = runCustom;
  </script>
</body>
</html>
